services:
  markdown-editor:
    build: .
    restart: unless-stopped
    user: "${EDITOR_UID:-1000}:${EDITOR_GID:-1000}"
    ports:
      - "${EDITOR_BIND:-127.0.0.1}:${EDITOR_PORT:-8080}:8080"
    volumes:
      - ./runtime:/data/config
      - ./documents:/data/documents
      - ./logs:/data/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
